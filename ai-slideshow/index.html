
<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Enhanced Presentation Interface</title>

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/reveal.js/4.6.1/reveal.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css"
    />

    <style>
      @import url("https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap");
      @import url("https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css");

      /*********************************************
         * PRESENTATION LAYOUT
         *********************************************/

      body {
        margin: 0;
        padding: 0;
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display",
          "SF Pro Text", "Segoe UI", Inter, "Helvetica Neue", Arial, sans-serif;
      }

      .presentation-container {
        display: flex;
        height: 100vh;
        position: relative;
        padding: 20px;
        box-sizing: border-box;
      }

      /*********************************************
         * SLIDE NAVIGATOR PANEL
         *********************************************/

      .slide-navigator {
        width: 300px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border-right: 1px solid rgba(0, 0, 0, 0.1);
        border-radius: 12px;
        margin-right: 20px;
        padding: 20px;
        box-sizing: border-box;
        overflow-y: auto;
        z-index: 1000;
        transition: transform 0.3s ease;
      }

      .slide-navigator h3 {
        margin: 0 0 20px 0;
        font-size: 18px;
        font-weight: 600;
        color: #1d1d1f;
        border-bottom: 2px solid #007aff;
        padding-bottom: 10px;
      }

      .slide-nav-item {
        display: flex;
        align-items: center;
        padding: 12px;
        margin-bottom: 8px;
        border-radius: 8px;
        cursor: pointer;
        transition: all 0.2s ease;
        border: 1px solid transparent;
      }

      .slide-nav-item:hover {
        background: rgba(0, 122, 255, 0.1);
        border-color: rgba(0, 122, 255, 0.3);
      }

      .slide-nav-item.active {
        background: rgba(0, 122, 255, 0.15);
        border-color: #007aff;
        box-shadow: 0 2px 8px rgba(0, 122, 255, 0.2);
      }

      .slide-number {
        background: #007aff;
        color: white;
        border-radius: 6px;
        padding: 4px 8px;
        font-size: 12px;
        font-weight: 600;
        margin-right: 12px;
        min-width: 24px;
        text-align: center;
      }

      .slide-title {
        font-size: 14px;
        font-weight: 500;
        color: #1d1d1f;
        line-height: 1.3;
      }

      /*********************************************
         * HAMBURGER MENU (MOBILE)
         *********************************************/

      .hamburger-menu {
        display: none;
        position: fixed;
        top: 20px;
        left: 20px;
        z-index: 2000;
        background: rgba(255, 255, 255, 0.9);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        border: 1px solid rgba(0, 0, 0, 0.1);
        border-radius: 8px;
        padding: 12px;
        cursor: pointer;
        transition: all 0.3s ease;
      }

      .hamburger-menu:hover {
        background: rgba(255, 255, 255, 1);
        transform: scale(1.05);
      }

      .hamburger-icon {
        width: 24px;
        height: 18px;
        position: relative;
      }

      .hamburger-icon span {
        display: block;
        height: 2px;
        width: 100%;
        background: #1d1d1f;
        border-radius: 1px;
        position: absolute;
        transition: all 0.3s ease;
      }

      .hamburger-icon span:nth-child(1) {
        top: 0;
      }
      .hamburger-icon span:nth-child(2) {
        top: 8px;
      }
      .hamburger-icon span:nth-child(3) {
        top: 16px;
      }

      .hamburger-menu.active .hamburger-icon span:nth-child(1) {
        transform: rotate(45deg);
        top: 8px;
      }

      .hamburger-menu.active .hamburger-icon span:nth-child(2) {
        opacity: 0;
      }

      .hamburger-menu.active .hamburger-icon span:nth-child(3) {
        transform: rotate(-45deg);
        top: 8px;
      }

      /*********************************************
         * MAIN PRESENTATION AREA
         *********************************************/

      .main-presentation {
        flex: 1;
        position: relative;
        background: linear-gradient(135deg, #fafafa 0%, #f5f5f7 100%);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
        box-sizing: border-box;
      }

      /*********************************************
         * SLIDE STYLING - BIGGER SLIDES FOR BETTER SPACE USAGE
         *********************************************/

      .reveal-viewport {
        background: transparent !important;
        width: 100% !important;
        height: 100% !important;
      }

      .reveal .slides {
        width: 100% !important;
        height: 100% !important;
      }

      .reveal .slides section {
        background: white;
        border-radius: 12px;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.12);
        border: 1px solid rgba(0, 0, 0, 0.05);
        padding: 50px !important;
        box-sizing: border-box;
        max-width: 95%;
        width: 95%;
        height: 85vh;
        max-height: 85vh;
        margin: 0 auto;
        display: flex !important;
        flex-direction: column;
        justify-content: flex-start;
        overflow-y: auto;
        text-align: left;
      }

      .reveal .slides section.present {
        transform: none !important;
      }

      /*********************************************
         * CUSTOM THEME (from your previous version)
         *********************************************/

      :root {
        --r-background-color: transparent;
        --r-main-font: -apple-system, BlinkMacSystemFont, "SF Pro Display",
          "SF Pro Text", "Segoe UI", Inter, "Helvetica Neue", Arial, sans-serif;
        --r-main-font-size: 18px;
        --r-main-color: rgb(29, 29, 31);
        --r-block-margin: 24px;
        --r-heading-margin: 0 0 24px 0;
        --r-heading-font: -apple-system, BlinkMacSystemFont, "SF Pro Display",
          "SF Pro Text", "Segoe UI", Inter, "Helvetica Neue", Arial, sans-serif;
        --r-heading-color: #1d1d1f;
        --r-heading-line-height: 1.3;
        --r-heading-letter-spacing: -0.01em;
        --r-heading-text-transform: none;
        --r-heading-text-shadow: none;
        --r-heading-font-weight: 600;
        --r-heading1-text-shadow: none;
        --r-heading1-size: 36px;
        --r-heading2-size: 34px;
        --r-heading3-size: 32px;
        --r-heading4-size: 30px;
        --r-heading5-size: 28px;
        --r-heading6-size: 26px;
        --r-code-font: "SF Mono", "Monaco", "Menlo", "Consolas", "Courier New",
          monospace;
        --r-link-color: #007aff;
        --r-link-color-dark: #0056b3;
        --r-link-color-hover: #0056b3;
        --r-selection-background-color: #007aff;
        --r-selection-color: #fff;
      }

      .reveal {
        font-family: var(--r-main-font);
        font-size: var(--r-main-font-size);
        font-weight: normal;
        color: var(--r-main-color);
      }

      .reveal h1,
      .reveal h2,
      .reveal h3,
      .reveal h4,
      .reveal h5,
      .reveal h6 {
        margin: var(--r-heading-margin);
        color: var(--r-heading-color);
        font-family: var(--r-heading-font);
        font-weight: var(--r-heading-font-weight);
        line-height: var(--r-heading-line-height);
        letter-spacing: var(--r-heading-letter-spacing);
        text-transform: var(--r-heading-text-transform);
        text-shadow: var(--r-heading-text-shadow);
        word-wrap: break-word;
        text-align: center;
      }

      .reveal h1 {
        font-size: var(--r-heading1-size);
      }
      .reveal h2 {
        font-size: var(--r-heading2-size);
      }
      .reveal h3 {
        font-size: var(--r-heading3-size);
      }
      .reveal h4 {
        font-size: var(--r-heading4-size);
      }
      .reveal h5 {
        font-size: var(--r-heading5-size);
      }
      .reveal h6 {
        font-size: var(--r-heading6-size);
      }

      .reveal p {
        margin: var(--r-block-margin) 0;
        line-height: 1.6;
      }

      .reveal a {
        color: var(--r-link-color);
        text-decoration: none;
        transition: color 0.15s ease;
      }

      .reveal a:hover {
        color: var(--r-link-color-hover);
      }

      .reveal code {
        font-family: var(--r-code-font);
        background: rgba(0, 0, 0, 0.05);
        padding: 4px 8px;
        border-radius: 6px;
        font-size: 0.9em;
      }

      .reveal pre {
        background: rgba(0, 0, 0, 0.05);
        border-radius: 12px;
        padding: 20px;
        margin: var(--r-block-margin) 0;
      }

      .reveal pre code {
        background: transparent;
        padding: 0;
      }

      .reveal ul {
        list-style: none;
        padding-left: 0;
      }

      .reveal ul li {
        position: relative;
        padding-left: 32px;
        margin-bottom: 12px;
        line-height: 1.6;
      }

      .reveal ul li::before {
        content: "";
        width: 6px;
        height: 6px;
        background: var(--r-link-color);
        border-radius: 50%;
        position: absolute;
        left: 8px;
        top: 0.65em;
      }

      .reveal blockquote {
        background: rgba(0, 122, 255, 0.05);
        border-left: 4px solid var(--r-link-color);
        padding: 20px;
        margin: var(--r-block-margin) 0;
        border-radius: 8px;
        font-style: italic;
      }

      /*********************************************
         * MOBILE RESPONSIVE + TOUCH OPTIMIZATIONS
         *********************************************/

      @media (max-width: 768px) {
        .presentation-container {
          padding: 0;
        }

        .slide-navigator {
          display: none;
        }

        .hamburger-menu {
          display: none;
        }

        .main-presentation {
          width: 100%;
          padding: 0;
        }

        /* Override Reveal.js scaling on mobile */
        .reveal .slides {
          width: 100vw !important;
          height: 100vh !important;
          left: 0 !important;
          top: 0 !important;
          transform: none !important;
          margin: 0 !important;
          padding: 0 !important;
        }

        .reveal .slides section {
          padding: 20px !important;
          height: 100vh !important;
          max-height: 100vh !important;
          width: 100vw !important;
          max-width: 100vw !important;
          border-radius: 0 !important;
          box-shadow: none !important;
          border: none !important;
          top: 0 !important;
          left: 0 !important;
          transform: none !important;
          /* Ensure touch events work properly on slides */
          touch-action: pan-y;
          user-select: none;
          -webkit-user-select: none;
        }

        .reveal h1,
        .reveal h2,
        .reveal h3,
        .reveal h4,
        .reveal h5,
        .reveal h6 {
          font-size: 20px;
          margin-bottom: 16px;
        }

        .reveal p {
          font-size: 16px;
          line-height: 1.7;
          margin: 16px 0;
        }

        .reveal ul li {
          margin-bottom: 8px;
          font-size: 16px;
        }

        /* Optimize code blocks for mobile touch */
        .reveal pre {
          font-size: 0.7em;
          margin: 16px 0;
          padding: 15px;
          /* Allow vertical scrolling in code blocks */
          touch-action: pan-y;
          user-select: text;
          -webkit-user-select: text;
        }

        .reveal pre code {
          /* Prevent swipe interference in code blocks */
          touch-action: pan-y;
        }

        .reveal blockquote {
          margin: 16px 0;
          padding: 15px;
        }
      }

      /* Prevent swipe interference on specific elements */
      .reveal pre[data-prevent-swipe],
      .reveal code[data-prevent-swipe],
      .slide-navigator[data-prevent-swipe] {
        touch-action: pan-y;
      }

      /*********************************************
         * OVERLAY FOR MOBILE MENU
         *********************************************/

      .mobile-overlay {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background: rgba(0, 0, 0, 0.5);
        z-index: 1400;
      }

      .mobile-overlay.active {
        display: block;
      }

      /*********************************************
         * SYNTAX HIGHLIGHTING
         *********************************************/

      .reveal .hljs {
        background: transparent !important;
        color: var(--r-main-color);
      }

      .reveal .hljs-keyword,
      .reveal .hljs-built_in,
      .reveal .hljs-type {
        color: #af00db;
        font-weight: 600;
      }

      .reveal .hljs-string,
      .reveal .hljs-attr {
        color: #c41e3a;
      }

      .reveal .hljs-number,
      .reveal .hljs-literal {
        color: #1c00cf;
      }

      .reveal .hljs-comment {
        color: #6a6a6c;
        font-style: italic;
      }

      .reveal .hljs-function,
      .reveal .hljs-title,
      .reveal .hljs-title.function_ {
        color: #0040dd;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <!-- Mobile Overlay -->
    <div class="mobile-overlay" id="mobileOverlay"></div>

    <!-- Hamburger Menu (Mobile) -->
    <div class="hamburger-menu" id="hamburgerMenu">
      <div class="hamburger-icon">
        <span></span>
        <span></span>
        <span></span>
      </div>
    </div>

    <div class="presentation-container">
      <!-- Slide Navigator Panel -->
      <div class="slide-navigator" id="slideNavigator">
        <h3>📋 Slide Navigator</h3>
        <div id="slideNavItems">
          <!-- Slide navigation items will be generated here -->
        </div>
      </div>

      <!-- Main Presentation Area -->
      <div class="main-presentation">
        <div class="reveal">
          <div class="slides">
            <section data-markdown="./slides/intro.md" data-slide-title="Intro">
            </section>
            <section data-markdown="./slides/history1.md" data-slide-title="History">
            </section>
            <section data-markdown="./slides/history2.md" data-slide-title="History(contd)">
            </section>
            <section data-markdown="./slides/model-example.md" data-slide-title="AI model example">
            </section>
            <section data-markdown="./slides/model-example-2.md" data-slide-title="AI model example (contd)">
            </section>
            <section data-markdown="./slides/model-example-3.md" data-slide-title="AI model example (contd)">
            </section>
            <section data-markdown="./slides/model-example-4.md" data-slide-title="AI model example (contd)">
            </section>
            <section data-markdown="./slides/model-example-5.md"  data-slide-title="What is a model anyway?">
            </section>
            <section data-markdown="./slides/model-example-6.md" data-slide-title="What is a model anyway? (contd)">
            </section>
            <section data-markdown="./slides/llm.md" data-slide-title="What is an LLM?">
            </section>
            <section data-markdown="./slides/llm-2.md" data-slide-title="What is an LLM? (contd)">
            </section>
            <section data-markdown="./slides/llm-3.md" data-slide-title="What is an LLM? (contd)">
            </section>
            <section data-markdown="./slides/llm-4.md" data-slide-title="What is an LLM? (contd)">
            </section>
            <section data-markdown="./slides/transformer.md" data-slide-title="What is a transformer">
            </section>
            <section data-markdown="./slides/transformer-efficient.md" data-slide-title="What is a transformer? (contd)">
            </section>
            <section data-markdown="./slides/transformer-efficient-2.md" data-slide-title="What is a transformer? (contd)">
            </section>
            <section data-markdown="./slides/model-look-like.md" data-slide-title="What does a model look like?">
            </section>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/reveal.js/4.6.1/reveal.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/reveal.js/4.6.1/plugin/markdown/markdown.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/reveal.js/4.6.1/plugin/highlight/highlight.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/reveal.js/4.6.1/plugin/math/math.min.js"></script>

    <script>
      // Initialize Reveal.js
      Reveal.initialize({
        hash: true,
        plugins: [RevealMarkdown, RevealHighlight, RevealMath.KaTeX],
        transition: "slide",
        controls: true, // Hide default controls since we have our navigator
        progress: true, // Hide progress bar since we have slide navigator
        // Enhanced mobile/touch settings
        touch: true, // Enable touch navigation (default: true)
        loop: false, // Don't loop presentations
        rtl: false, // Left-to-right reading
        math: {
          mathjax:
            "https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js",
          config: "TeX-AMS_HTML-full",
          // pass other options into `MathJax.Hub.Config()`
          TeX: { Macros: { RR: "{\\bf R}" } },
        },

        // Mobile optimizations
        embedded: false,
        keyboard: true,
        overview: true,
        center: true,

        // Touch threshold - how far you need to swipe to trigger navigation
        touchThreshold: 30,

        // Transition settings optimized for mobile
        transitionSpeed: "default",
        backgroundTransition: "fade",

        // CRITICAL: Disable auto-scaling on mobile
        width: "100%",
        height: "100%",
        margin: 0,
        minScale: 1,
        maxScale: 1,
      });

      // Generate slide navigation items
      function generateSlideNav() {
        const slides = document.querySelectorAll(".reveal .slides section");
        const navContainer = document.getElementById("slideNavItems");

        slides.forEach((slide, index) => {
          const title =
            slide.getAttribute("data-slide-title") || `Slide ${index + 1}`;

          const navItem = document.createElement("div");
          navItem.className = "slide-nav-item";
          navItem.setAttribute("data-slide-index", index);

          navItem.innerHTML = `
                    <div class="slide-number">${index + 1}</div>
                    <div class="slide-title">${title}</div>
                `;

          navItem.addEventListener("click", () => {
            Reveal.slide(index);
            updateActiveSlide(index);

            // Close mobile menu if open
            if (window.innerWidth <= 768) {
              closeMobileMenu();
            }
          });

          navContainer.appendChild(navItem);
        });

        // Set first slide as active
        updateActiveSlide(0);
      }

      // Update active slide in navigator
      function updateActiveSlide(index) {
        const navItems = document.querySelectorAll(".slide-nav-item");
        navItems.forEach((item, i) => {
          item.classList.toggle("active", i === index);
        });
      }

      // Listen for slide changes
      Reveal.on("slidechanged", (event) => {
        updateActiveSlide(event.indexh);
      });

      // Mobile menu functionality
      const hamburgerMenu = document.getElementById("hamburgerMenu");
      const slideNavigator = document.getElementById("slideNavigator");
      const mobileOverlay = document.getElementById("mobileOverlay");

      hamburgerMenu.addEventListener("click", toggleMobileMenu);
      mobileOverlay.addEventListener("click", closeMobileMenu);

      function toggleMobileMenu() {
        const isOpen = slideNavigator.classList.contains("open");
        if (isOpen) {
          closeMobileMenu();
        } else {
          openMobileMenu();
        }
      }

      function openMobileMenu() {
        slideNavigator.classList.add("open");
        hamburgerMenu.classList.add("active");
        mobileOverlay.classList.add("active");
      }

      function closeMobileMenu() {
        slideNavigator.classList.remove("open");
        hamburgerMenu.classList.remove("active");
        mobileOverlay.classList.remove("active");
      }

      // Keyboard shortcut to toggle navigator (T key)
      document.addEventListener("keydown", function (e) {
        if (e.key === "t" || e.key === "T") {
          if (window.innerWidth <= 768) {
            toggleMobileMenu();
          } else {
            slideNavigator.style.display =
              slideNavigator.style.display === "none" ? "block" : "none";
          }
          e.preventDefault();
        }
      });

      // Initialize navigation after DOM is loaded
      document.addEventListener("DOMContentLoaded", function () {
        generateSlideNav();
      });

      // Handle window resize
      window.addEventListener("resize", function () {
        if (window.innerWidth > 768) {
          closeMobileMenu();
          slideNavigator.style.display = "block";
        }
      });
    </script>
  </body>
</html>
